[project]
name = "no-human"
version = "0.1.0"
description = "Autonomous AI software-delivery orchestrator driving the Claude Agent SDK on your subscription"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "claude-agent-sdk>=0.2.106",
    "click>=8.4.1",
    "fastapi>=0.138.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "textual>=8.2.7",
    "uvicorn>=0.49.0",
]

[project.scripts]
nh = "no_human.cli.commands:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/no_human"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
