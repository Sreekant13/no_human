- id: startup-01-volumetric-weight
  title: PAR-11 Bill bulky parcels on volumetric weight
  kind: feature
  request: Our carrier bills us on volumetric weight for bulky parcels and we only ever bill the customer
    on actual weight, so every large light box loses us money. Quoting needs to charge on whichever is
    greater. Volumetric weight in kg is length x width x height in centimetres divided by 5000. Callers
    should be able to pass the parcel's dimensions to quote(); when they don't, nothing about the price
    may change.
  acceptance_criteria:
  - quote() accepts optional parcel dimensions in centimetres
  - the billed weight is the greater of actual and volumetric weight
  - a quote with no dimensions returns exactly the price it does today
  - the new behaviour is covered by a test
  solution:
    parcelo/rates.py: |
      """Quoting: what a shipment costs."""

      from parcelo.zones import surcharge_for, zone_for

      BASE_FEE = 3.20
      PER_KG = 1.10
      EXPRESS_MULTIPLIER = 1.5
      VOLUMETRIC_DIVISOR = 5000.0


      def volumetric_weight(dimensions_cm):
          """Volumetric weight in kg for (length, width, height) in centimetres."""
          if not dimensions_cm:
              return 0.0
          length, width, height = dimensions_cm
          return round(length * width * height / VOLUMETRIC_DIVISOR, 4)


      def chargeable_weight(weight_kg, dimensions_cm=None):
          """Carriers bill the greater of actual and volumetric weight."""
          return max(weight_kg, volumetric_weight(dimensions_cm))


      def quote(weight_kg, origin, destination, express=False, dimensions_cm=None):
          """The all-in price for a shipment."""
          origin_zone = zone_for(origin)
          dest_zone = zone_for(destination)
          weight_cost = round(PER_KG * chargeable_weight(weight_kg, dimensions_cm), 2)
          surcharge = surcharge_for(origin_zone, dest_zone)
          total = BASE_FEE + weight_cost + surcharge
          if express:
              total = total * EXPRESS_MULTIPLIER + surcharge
          return round(total, 2)
