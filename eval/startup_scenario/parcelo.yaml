- id: startup-04-idempotent-order-creation
  title: PAR-14 Retried checkouts create duplicate orders
  kind: bugfix
  request: 'The mobile app retries on a flaky connection and we end up shipping the same parcel twice.
    Order creation needs an idempotency key: two create_order calls with the same key must return the
    same order and must only ever create one. Calls without a key keep today''s behaviour and always create
    a new order. The key has to be accepted through the API layer too.'
  acceptance_criteria:
  - create_order accepts an optional idempotency key
  - two creations with the same key return the same order and create one order
  - two creations with different keys create two orders
  - a creation with no key always creates a new order
  - the API layer accepts and forwards the idempotency key
  solution:
    parcelo/orders.py: |
      """In-memory order store — the seed-stage "database"."""

      import itertools


      class OrderStore:
          """Orders held by id, with optional idempotent creation."""

          def __init__(self):
              self._orders = {}
              self._by_key = {}
              self._ids = itertools.count(1)

          def create_order(self, postcode, weight_kg, price, idempotency_key=None):
              """Create an order. A repeated *idempotency_key* returns the first one."""
              if idempotency_key is not None and idempotency_key in self._by_key:
                  return dict(self._orders[self._by_key[idempotency_key]])
              order_id = "ORD-%05d" % next(self._ids)
              self._orders[order_id] = {
                  "id": order_id, "postcode": postcode, "weight_kg": weight_kg,
                  "price": price, "status": "created",
              }
              if idempotency_key is not None:
                  self._by_key[idempotency_key] = order_id
              return dict(self._orders[order_id])

          def get_order(self, order_id):
              order = self._orders.get(order_id)
              return dict(order) if order else None

          def count(self):
              return len(self._orders)
    parcelo/api.py: |
      """Dispatch layer: dict in, dict out. The HTTP shim only calls handle()."""

      from parcelo.orders import OrderStore
      from parcelo.rates import quote, quote_breakdown
      from parcelo.zones import UnknownPostcode

      STORE = OrderStore()


      def handle(request):
          """Route one request dict to a response dict."""
          op = request.get("op")
          try:
              if op == "quote":
                  breakdown = quote_breakdown(
                      request["weight_kg"], request["origin"], request["destination"],
                      express=bool(request.get("express", False)),
                      dimensions_cm=request.get("dimensions_cm"))
                  total = breakdown.pop("total")
                  return {"ok": True, "total": total, "breakdown": breakdown}
              if op == "create_order":
                  total = quote(request["weight_kg"], request["origin"],
                                request["destination"],
                                express=bool(request.get("express", False)),
                                dimensions_cm=request.get("dimensions_cm"))
                  order = STORE.create_order(
                      request["destination"], request["weight_kg"], total,
                      idempotency_key=request.get("idempotency_key"))
                  return {"ok": True, "order": order}
          except UnknownPostcode as exc:
              return {"ok": False, "error": "unknown postcode: %s" % exc}
          except KeyError as exc:
              return {"ok": False, "error": "missing field: %s" % exc}
          return {"ok": False, "error": "unknown op: %s" % op}
    tests/test_orders.py: |
      from parcelo.orders import OrderStore


      def test_create_and_get_order():
          store = OrderStore()
          order = store.create_order("SW1A 2AA", 2.0, 6.90)
          assert order["id"].startswith("ORD-")
          assert store.get_order(order["id"])["price"] == 6.90


      def test_order_ids_are_unique():
          store = OrderStore()
          a = store.create_order("SW1A 2AA", 2.0, 6.90)
          b = store.create_order("SW1A 2AA", 2.0, 6.90)
          assert a["id"] != b["id"]
          assert store.count() == 2


      def test_repeat_idempotency_key_returns_the_first_order():
          store = OrderStore()
          a = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k1")
          b = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k1")
          assert a["id"] == b["id"]
          assert store.count() == 1
    tests/test_api.py: |
      from parcelo.api import handle


      def test_quote_op_returns_a_total():
          r = handle({"op": "quote", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "SW1A 2AA"})
          assert r["ok"] is True
          assert r["total"] == 6.90


      def test_create_order_op_returns_an_order():
          r = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "SW1A 2AA"})
          assert r["ok"] is True
          assert r["order"]["price"] == 6.90


      def test_unknown_postcode_is_an_error_not_a_crash():
          r = handle({"op": "quote", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "ZZ99 9ZZ"})
          assert r["ok"] is False
          assert "unknown postcode" in r["error"]


      def test_unknown_op_is_rejected():
          assert handle({"op": "teleport"})["ok"] is False


      def test_quote_op_returns_a_breakdown():
          r = handle({"op": "quote", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "SW1A 2AA"})
          assert r["breakdown"]["base"] == 3.20
          assert r["breakdown"]["surcharge"] == 1.50


      def test_create_order_op_is_idempotent():
          a = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "SW1A 2AA", "idempotency_key": "seed-1"})
          b = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                      "destination": "SW1A 2AA", "idempotency_key": "seed-1"})
          assert a["order"]["id"] == b["order"]["id"]
  holdout: |
    from parcelo.api import handle
    from parcelo.orders import OrderStore


    def test_repeat_idempotency_key_returns_the_same_order():
        store = OrderStore()
        a = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k1")
        b = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k1")
        assert a["id"] == b["id"]
        assert store.count() == 1


    def test_distinct_idempotency_keys_create_distinct_orders():
        store = OrderStore()
        a = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k1")
        b = store.create_order("SW1A 2AA", 2.0, 6.90, idempotency_key="k2")
        assert a["id"] != b["id"]
        assert store.count() == 2


    def test_orders_without_a_key_are_never_deduplicated():
        store = OrderStore()
        a = store.create_order("SW1A 2AA", 2.0, 6.90)
        b = store.create_order("SW1A 2AA", 2.0, 6.90)
        assert a["id"] != b["id"]


    def test_api_create_order_is_idempotent():
        a = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                    "destination": "SW1A 2AA", "idempotency_key": "holdout-1"})
        b = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                    "destination": "SW1A 2AA", "idempotency_key": "holdout-1"})
        assert a["order"]["id"] == b["order"]["id"]


    def test_regression_order_price_uses_the_fixed_express_rule():
        r = handle({"op": "create_order", "weight_kg": 2.0, "origin": "EC1A 1BB",
                    "destination": "SW1A 2AA", "express": True,
                    "idempotency_key": "holdout-2"})
        assert r["order"]["price"] == 9.60
