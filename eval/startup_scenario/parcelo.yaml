- id: startup-03-quote-breakdown
  title: PAR-13 Show customers what they are paying for
  kind: feature
  request: 'Support keeps getting ''why is this so expensive'' emails and we have nothing to show. The
    quote response from the API layer needs a breakdown alongside the total: the base fee, the weight
    charge, the zone surcharge, the express uplift, and the weight we actually charged on. The components
    must add up to the total that is returned. The API layer should also accept parcel dimensions and
    pass them through.'
  acceptance_criteria:
  - a quote request through the API layer returns a breakdown as well as a total
  - the breakdown names the base fee, weight charge, zone surcharge, express uplift and the chargeable
    weight
  - the breakdown components sum to the returned total
  - the API layer accepts parcel dimensions and passes them to quoting
  solution:
    parcelo/rates.py: |
      """Quoting: what a shipment costs."""

      from parcelo.zones import surcharge_for, zone_for

      BASE_FEE = 3.20
      PER_KG = 1.10
      EXPRESS_MULTIPLIER = 1.5
      VOLUMETRIC_DIVISOR = 5000.0


      def volumetric_weight(dimensions_cm):
          """Volumetric weight in kg for (length, width, height) in centimetres."""
          if not dimensions_cm:
              return 0.0
          length, width, height = dimensions_cm
          return round(length * width * height / VOLUMETRIC_DIVISOR, 4)


      def chargeable_weight(weight_kg, dimensions_cm=None):
          """Carriers bill the greater of actual and volumetric weight."""
          return max(weight_kg, volumetric_weight(dimensions_cm))


      def quote_breakdown(weight_kg, origin, destination, express=False,
                          dimensions_cm=None):
          """Every component of a quote, plus the total they sum to."""
          origin_zone = zone_for(origin)
          dest_zone = zone_for(destination)
          charged = chargeable_weight(weight_kg, dimensions_cm)
          weight_cost = round(PER_KG * charged, 2)
          surcharge = surcharge_for(origin_zone, dest_zone)
          express_uplift = 0.0
          if express:
              express_uplift = round((BASE_FEE + weight_cost) * (EXPRESS_MULTIPLIER - 1), 2)
          total = round(BASE_FEE + weight_cost + surcharge + express_uplift, 2)
          return {
              "base": BASE_FEE,
              "weight": weight_cost,
              "surcharge": surcharge,
              "express_uplift": express_uplift,
              "chargeable_weight_kg": charged,
              "total": total,
          }


      def quote(weight_kg, origin, destination, express=False, dimensions_cm=None):
          """The all-in price for a shipment."""
          return quote_breakdown(weight_kg, origin, destination, express=express,
                                 dimensions_cm=dimensions_cm)["total"]
    parcelo/api.py: |
      """Dispatch layer: dict in, dict out. The HTTP shim only calls handle()."""

      from parcelo.orders import OrderStore
      from parcelo.rates import quote, quote_breakdown
      from parcelo.zones import UnknownPostcode

      STORE = OrderStore()


      def handle(request):
          """Route one request dict to a response dict."""
          op = request.get("op")
          try:
              if op == "quote":
                  breakdown = quote_breakdown(
                      request["weight_kg"], request["origin"], request["destination"],
                      express=bool(request.get("express", False)),
                      dimensions_cm=request.get("dimensions_cm"))
                  total = breakdown.pop("total")
                  return {"ok": True, "total": total, "breakdown": breakdown}
              if op == "create_order":
                  total = quote(request["weight_kg"], request["origin"],
                                request["destination"],
                                express=bool(request.get("express", False)),
                                dimensions_cm=request.get("dimensions_cm"))
                  order = STORE.create_order(request["destination"],
                                             request["weight_kg"], total)
                  return {"ok": True, "order": order}
          except UnknownPostcode as exc:
              return {"ok": False, "error": "unknown postcode: %s" % exc}
          except KeyError as exc:
              return {"ok": False, "error": "missing field: %s" % exc}
          return {"ok": False, "error": "unknown op: %s" % op}
