id: add-dedupe
title: "Add dedupe() preserving order"
description: >
  Add dedupe(xs) that removes duplicates while preserving first-seen order
  (set() alone loses order). Add a test.
acceptance_criteria:
  - "dedupe(xs) removes duplicates and preserves first-seen order"
  - "a test covers dedupe()"
setup:
  seqx.py: |
    def count(xs):
        return len(xs)
  test_seqx.py: |
    from seqx import count


    def test_count():
        assert count([1, 2]) == 2
solution:
  seqx.py: |
    def count(xs):
        return len(xs)


    def dedupe(xs):
        seen = set()
        out = []
        for x in xs:
            if x not in seen:
                seen.add(x)
                out.append(x)
        return out
  test_seqx.py: |
    from seqx import count, dedupe


    def test_count():
        assert count([1, 2]) == 2


    def test_dedupe():
        assert dedupe([1, 1, 2, 3, 2]) == [1, 2, 3]
known_good_diff: |
  --- a/seqx.py
  +++ b/seqx.py
  @@
   def count(xs):
       return len(xs)
  +
