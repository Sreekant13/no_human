name: CI

# Nothing here may reach a model API, spend a token, or push to a repository.
# The Python suite is hermetic by construction: tests/conftest.py installs an
# autouse fixture that swaps ClaudeBackend for a stub everywhere the
# orchestrator builds one, and it only steps aside when NH_TESTS_LIVE_SDK=1,
# which is never set in CI. The `real_backend` marker exempts a handful of
# tests from that stub, but those drive the real class over a mocked SDK
# client and still make no network call.
#
# The live `nh eval` / `nh bench` runs spend subscription tokens through the
# Agent SDK. They are run locally, on demand, and are not part of any job here.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Agreement to CLA.md is recorded as a file in contributors/, not in a
  # third-party signing service. This job is the only thing that notices when
  # one is missing: it asks GitHub who authored the commits in the PR — GitHub
  # resolves the login, so nothing here has to guess at email identity — and
  # fails if any of them has no ledger entry. It checks that a file exists and
  # nothing more; it cannot verify a signature and does not try to.
  cla:
    name: CLA ledger
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4

      - name: Every commit author has a contributors/ entry
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The maintainer does not sign their own agreement.
          MAINTAINER: eyalgolan
        run: |
          set -euo pipefail

          # .author.login is null when the commit's email address is not
          # attached to any GitHub account. That is unsigned as far as this
          # ledger is concerned, and the error below says how to fix it.
          authors=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            --jq '.[].author.login // "UNLINKED-EMAIL"' | sort -u)

          missing=""
          for author in $authors; do
            case "$author" in
              # Bot accounts (dependabot[bot], github-actions[bot]) hold no
              # copyright, so there is nothing for them to license.
              "$MAINTAINER"|*'[bot]') continue ;;
              # Never resolve the null-login sentinel to a filename: committing
              # contributors/unlinked-email.md would otherwise turn this job
              # green for an author GitHub cannot identify, which is the one
              # thing the ledger exists to prevent.
              UNLINKED-EMAIL) missing="${missing} ${author}"; continue ;;
            esac
            handle=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')
            if [ ! -f "contributors/${handle}.md" ]; then
              missing="${missing} ${author}"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::No CLA ledger entry for:${missing}"
            echo
            echo "This pull request has commits by:${missing}"
            echo
            echo "Each of them needs to agree to CLA.md once, by adding one"
            echo "file to this PR:"
            for author in $missing; do
              if [ "$author" = "UNLINKED-EMAIL" ]; then
                echo "    (no file can be named for this one — see below)"
                continue
              fi
              handle=$(printf '%s' "$author" | tr '[:upper:]' '[:lower:]')
              echo "    contributors/${handle}.md"
            done
            echo
            echo "The file says which version of CLA.md you agree to. Copy the"
            echo "template in contributors/README.md, fill it in, commit it,"
            echo "and push. You only ever do this once."
            echo
            echo "If an author above is UNLINKED-EMAIL, the email on those"
            echo "commits is not attached to a GitHub account, so GitHub cannot"
            echo "tell us who signed. Add it to your account, or re-commit with"
            echo "an address that is already there."
            exit 1
          fi

          echo "Every commit author has a contributors/ entry."

  python:
    name: Python
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # uv reads .python-version (3.12), so the toolchain cannot drift away
      # from the file that declares it.
      - name: Install dependencies
        run: uv sync --frozen

      # -n auto has wedged on this repo, so the worker count is explicit.
      #
      # The first two deselected tests read local IDE transcripts through
      # no_human.history.extractor, which scans running processes for a
      # language server. They raise IDENotRunningError on any machine without
      # that IDE open, which includes every CI runner.
      #
      # The third is deselected for a defect in the product, not in the runner.
      # test_two_repos_run_concurrently_in_worktrees is the only test that
      # drives two orchestrators against one Store at once, and a commit in
      # Store.update_attempt raises "cannot commit transaction - SQL statements
      # in progress" in roughly a third of runs. This is NOT an xdist flake: it
      # reproduces with no xdist and with the test running alone, so lowering
      # the worker count does nothing. Deselecting it keeps this badge honest
      # instead of red on a third of pushes; it does not pretend the race is
      # fixed. Repro data, the hypothesis already ruled out, and what a fix has
      # to prove are in docs/KNOWN_ISSUES.md (KI-1). Run it locally, repeatedly,
      # if you touch core/db.py or the scheduler.
      - name: Run tests
        run: |
          uv run pytest -q --tb=short -n 4 \
            --deselect tests/test_scheduler.py::test_reanalysis_maybe_run_produces_result \
            --deselect tests/test_scheduler.py::test_reanalysis_dedup_across_runs \
            --deselect tests/test_scheduler.py::test_two_repos_run_concurrently_in_worktrees

  web:
    name: Web board
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # This job runs the node unit suite only. The Playwright suites in
      # web/e2e need a browser and, for some of them, a running server.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      # Node 20 on purpose. `npm test` is `node --test src/`, and from Node 22
      # a directory argument to --test is resolved as a module instead of
      # being walked, so the script fails there. .gitlab-ci.yml pins
      # node:20-slim for the same job.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm test

  desktop:
    name: Desktop shell
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      # --ignore-scripts skips Electron's postinstall, which fetches a ~100 MB
      # platform binary. The suite does not need it: Electron is stubbed
      # through desktop/testing/electronLoader.mjs.
      - run: npm ci --ignore-scripts

      # `npm test` is `node --test .`, which Node 22 rejects, so the files are
      # listed explicitly. uiPages.test.mjs is the one suite that does need the
      # real Electron binary: it spawns a renderer to read computed styles.
      # Run it locally with a full `npm ci`.
      - name: Run tests
        run: |
          files=()
          for f in ./*.test.mjs; do
            [ "$f" = "./uiPages.test.mjs" ] && continue
            files+=("$f")
          done
          node --test "${files[@]}"
